{% extends "base.html" %}
{% block content %}
<h2>编辑学生</h2>
<form method="post" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>姓名
    <input type="text" name="name" value="{{ student.name }}" required />
  </label>
  <label>小时费率 (¥)
    <input type="number" name="hourly_rate" step="0.01" min="0" value="{{ "%.2f"|format(student.hourly_rate) }}" required />
  </label>
  <label>学期阶段
    <select name="stage" required>
      {% for s in STAGE_CHOICES %}
        <option value="{{ s }}" {% if student.stage == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <label>收费模式
    <select name="charge_mode">
      {% for k, label in CHARGE_MODE_CHOICES %}
        <option value="{{ k }}" {% if student.charge_mode == k %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <div class="row">
    <label style="flex:1">预付剩余课时 (h)
      <input type="number" step="0.1" name="remaining_hours" value="{{ '%.2f'|format(student.remaining_hours) }}" min="0">
    </label>
    <label style="flex:1">当前欠费 (¥)
      <input type="number" step="0.01" name="outstanding_amount" value="{{ '%.2f'|format(student.outstanding_amount) }}" min="0">
    </label>
    <label style="flex:1">账户余额 (¥)
      <input type="number" step="0.01" name="balance_amount" value="{{ '%.2f'|format(student.balance_amount) }}" min="0">
    </label>
  </div>
  <div class="row">
    <button type="submit">保存修改</button>
    <a class="btn" href="{{ url_for('students') }}">返回列表</a>
  </div>
</form>
{% endblock %}
